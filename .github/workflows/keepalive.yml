name: 🤖 Infrastructure Keep-Alive Bots

on:
  schedule:
    # Run every 12 minutes to prevent Render free container spin-down (<15 min idle)
    # and execute Supabase keep-alive transactions to prevent project auto-pause (<7 days)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: keepalive-cron
  cancel-in-progress: false

jobs:
  keepalive-bots:
    name: 🚀 Warm-Up Render & Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🌐 Bot 1 — Render Warm-Up Ping (/ready)
        run: |
          echo "::group::Bot 1: Pinging Render Service"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://nyayasarathi.onrender.com/ready)
          echo "Render /ready response HTTP status: $STATUS_CODE"
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo "✅ Render container is active and warm."
          else
            echo "⚠️ Render ping returned status $STATUS_CODE. Retrying..."
            sleep 5
            curl -f -s -S --max-time 90 https://nyayasarathi.onrender.com/ready || exit 1
          fi
          echo "::endgroup::"

      - name: 🗄️ Bot 2 — Supabase Active DB Pulse (/supa)
        run: |
          echo "::group::Bot 2: Triggering Supabase Keepalive Transaction"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://nyayasarathi.onrender.com/supa)
          echo "Supabase /supa response HTTP status: $STATUS_CODE"
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo "✅ Supabase keep-alive transaction executed successfully."
          else
            echo "⚠️ Supabase keep-alive returned status $STATUS_CODE. Retrying..."
            sleep 5
            curl -f -s -S --max-time 90 https://nyayasarathi.onrender.com/supa || exit 1
          fi
          echo "::endgroup::"
